name: repopilot
x-api: &api
  build: ./apps/api
  environment: &api-env
    APP_ENV: ${APP_ENV:-production}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-repopilot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-repopilot}
    REDIS_URL: redis://redis:6379/0
    GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set GITHUB_WEBHOOK_SECRET}
    DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
    DEMO_API_TOKEN: ${DEMO_API_TOKEN:-}
    GITHUB_OAUTH_ENABLED: ${GITHUB_OAUTH_ENABLED:-false}
    GITHUB_APP_ID: ${GITHUB_APP_ID:-0}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}
    GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}
  restart: unless-stopped
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repopilot}
      POSTGRES_DB: ${POSTGRES_DB:-repopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: ./apps/api
    environment: *api-env
    depends_on:
      postgres: {condition: service_healthy}
    command: [alembic, upgrade, head]
    restart: 'no'
  api:
    <<: *api
    ports: ['127.0.0.1:8000:8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    <<: *api
    command: [celery, -A, app.workers.tasks:celery, worker, --loglevel=WARNING, --concurrency=2]
  dispatcher:
    <<: *api
    command: [python, -m, app.workers.dispatcher]
  web:
    build: ./apps/web
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      DEMO_API_TOKEN: ${DEMO_API_TOKEN:-}
      API_INTERNAL_URL: http://api:8000
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
