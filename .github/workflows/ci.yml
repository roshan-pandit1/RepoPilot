name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: repopilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d repopilot_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/repopilot_test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/repopilot_test
      GITHUB_WEBHOOK_SECRET: ci-only-webhook-secret-000000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          version: '0.13.6'
      - run: uv sync --locked
        working-directory: apps/api
      - run: uv run --locked ruff check .
        working-directory: apps/api
      - run: uv run --locked alembic upgrade head && uv run --locked alembic check && uv run --locked alembic downgrade base && uv run --locked alembic upgrade head
        working-directory: apps/api
      - run: uv run --locked pytest -q
        working-directory: apps/api
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run typecheck && npm run lint && npm test && npm run build
        working-directory: apps/web
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ephemeral local demo configuration
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path
          Path('.env').write_text('APP_ENV=development\nDEMO_AUTH_ENABLED=true\nPOSTGRES_PASSWORD=' + secrets.token_hex(24) + '\nGITHUB_WEBHOOK_SECRET=' + secrets.token_hex(32) + '\nDEMO_API_TOKEN=' + secrets.token_hex(32) + '\n')
          PY
      - run: make dev && make seed && make smoke
      - if: always()
        run: docker compose down -v
