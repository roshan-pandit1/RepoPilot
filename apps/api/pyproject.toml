[project]
name = "repopilot-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0.38,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "celery[redis]>=5.5,<6", "httpx>=0.28,<1",
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
[tool.uv]
required-version = "==0.9.5"
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
