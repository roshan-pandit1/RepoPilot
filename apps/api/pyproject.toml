[project]
name = "repopilot-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0.38,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "celery[redis]>=5.5,<6", "httpx>=0.28,<1", "cryptography>=44,<47",
  "tree-sitter==0.25.2", "tree-sitter-javascript==0.25.0",
  "tree-sitter-typescript==0.23.2", "tree-sitter-java==0.23.5",
  "tree-sitter-go==0.25.0", "tree-sitter-rust==0.24.2",
  "tree-sitter-c==0.24.2", "tree-sitter-cpp==0.23.4", "tree-sitter-c-sharp==0.23.5",
]
[project.optional-dependencies]
local-embeddings = ["onnxruntime==1.31.1", "tokenizers==0.23.3", "numpy>=2.3,<3"]
[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "httpx2>=2,<3"]
[tool.uv]
required-version = "==0.13.6"
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
cache_dir = "/tmp/repopilot-pytest-cache"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
